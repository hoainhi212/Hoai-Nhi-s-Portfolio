<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dự án - Hà Hoài Nhi</title>

    <link rel="stylesheet" href="projects.css">
</head>

<body>

    <span>←</span>
</button>


<!-- =====================================================
     MENU BUTTON
===================================================== -->

<button class="menu-button" id="menuButton">

    <span></span>
    <span></span>
    <span></span>

</button>


<!-- =====================================================

===================================================== -->

<div class="menu-panel" id="menuPanel">

    <a href="about.html">
        Hồ sơ
    </a>

    <a href="skills.html">
        Kho kỹ năng
    </a>

    <a href="experience.html">
        Lịch sử công việc

    <a href="projects.html" class="active">
        Dự án nổi bật
    </a>

    <a href="certificates.html">
        Chứng chỉ
    </a>

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="projects-page">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="page-header">

        <h1>DỰ ÁN NỔI BẬT</h1>

        <p>
            Một vài thứ tớ đã xây dựng, đang xây dựng và sẽ xây dựng...
        </p>

    </header>

<!-- =====================================================
     CONSTRUCTION SITE
===================================================== -->

<section class="construction-site">

    <!-- =========================
         BIỂN ĐANG THI CÔNG
    ========================== -->

    <div class="construction-sign-board">

        <div class="warning-icon">⚠</div>

        <div class="sign-text">
            <strong>ĐANG THI CÔNG</strong>
            <span>PROJECT AREA</span>
        </div>

    </div>


    <!-- =========================
         THỎ 1 — ĐANG NHÌN THÙNG
    ========================== -->

    <div class="bunny bunny-look">

        <div class="bunny-ear ear-left"></div>
        <div class="bunny-ear ear-right"></div>

        <div class="bunny-head">

            <div class="bunny-eye eye-left"></div>
            <div class="bunny-eye eye-right"></div>

            <div class="bunny-nose"></div>

        </div>

        <div class="bunny-body"></div>

        <div class="bunny-foot foot-left"></div>
        <div class="bunny-foot foot-right"></div>

    </div>


    <!-- =========================
         THÙNG CHÍNH
    ========================== -->

    <div class="boxes-main">

        <!-- tầng dưới -->

        <div class="box box-large box-a">
            <div class="box-tape"></div>
        </div>

        <div class="box box-large box-b">
            <div class="box-tape"></div>
        </div>


        <!-- tầng giữa -->

        <div class="box box-medium box-c">
            <div class="box-tape"></div>
        </div>

        <div class="box box-medium box-d">
            <div class="box-tape"></div>
        </div>


        <!-- tầng trên -->

        <div class="box box-small box-e">
            <div class="box-tape"></div>
        </div>

    </div>


    <!-- =========================
         THỎ 2 — ĐANG BÊ ĐỒ
    ========================== -->

    <div class="bunny bunny-carry">

        <div class="bunny-ear ear-left"></div>
        <div class="bunny-ear ear-right"></div>

        <div class="bunny-head">

            <div class="bunny-eye eye-left"></div>
            <div class="bunny-eye eye-right"></div>

            <div class="bunny-nose"></div>

        </div>

        <div class="bunny-body"></div>

        <div class="bunny-arms">

            <div class="arm-left"></div>
            <div class="arm-right"></div>

        </div>

        <!-- món đồ đang bê -->

        <div class="carried-item"></div>

        <div class="bunny-foot foot-left"></div>
        <div class="bunny-foot foot-right"></div>

    </div>


    <!-- =========================
         THANG
    ========================== -->

    <div class="ladder">

        <div class="ladder-side ladder-left"></div>
        <div class="ladder-side ladder-right"></div>

        <div class="ladder-step step-1"></div>
        <div class="ladder-step step-2"></div>
        <div class="ladder-step step-3"></div>
        <div class="ladder-step step-4"></div>
        <div class="ladder-step step-5"></div>

    </div>


    <!-- =========================
         THỎ 3 — ĐANG LEO THANG
    ========================== -->

    <div class="bunny bunny-climb">

        <div class="bunny-ear ear-left"></div>
        <div class="bunny-ear ear-right"></div>

        <div class="bunny-head">

            <div class="bunny-eye eye-left"></div>
            <div class="bunny-eye eye-right"></div>

            <div class="bunny-nose"></div>

        </div>

        <div class="bunny-body"></div>

        <div class="bunny-arm-climb arm-climb-left"></div>
        <div class="bunny-arm-climb arm-climb-right"></div>

        <div class="bunny-leg-climb leg-climb-left"></div>
        <div class="bunny-leg-climb leg-climb-right"></div>

    </div>


    <!-- =========================
         THỎ 4 — NGỒI DỌN ĐỒ
    ========================== -->
    <div class="bunny bunny-clean">

        <div class="bunny-ear ear-left"></div>
        <div class="bunny-ear ear-right"></div>

        <div class="bunny-head">

            <div class="bunny-eye eye-left"></div>
            <div class="bunny-eye eye-right"></div>

            <div class="bunny-nose"></div>

        </div>

        <div class="bunny-body"></div>

        <div class="broom"></div>

        <div class="bunny-foot foot-left"></div>
        <div class="bunny-foot foot-right"></div>

    </div>

</section>


<script>

const menuButton = document.getElementById("menuButton");
const menuPanel = document.getElementById("menuPanel");

menuButton.addEventListener("click", function () {
    menuPanel.classList.toggle("open");
});

document.addEventListener("click", function (event) {

    if (
        !menuButton.contains(event.target) &&
        !menuPanel.contains(event.target)
    ) {
        menuPanel.classList.remove("open");
    }

});

</script>

</body>
</html>
